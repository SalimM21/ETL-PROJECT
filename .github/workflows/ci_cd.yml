name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: airflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U airflow -d airflow_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage

      - name: Lint & Format
        run: |
          pip install black flake8
          black --check .
          flake8 .

      - name: Run tests
        run: |
          pytest tests/ --cov=./ --maxfail=1 --disable-warnings -v

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t myrepo/airflow-project:latest .

      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: docker push myrepo/airflow-project:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        run: |
          echo "Déploiement du DAG et image Docker sur l'environnement staging..."
          # commandes SSH / kubectl / docker-compose selon ton infra

      - name: Deploy to production (manual)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Déploiement sur prod après validation..."
          # commandes SSH / kubectl / docker-compose
